[package]
name = "zqlite-rs"
version = "0.0.0"
edition = "2021"

[lib]
crate-type = ["cdylib"]

[dependencies]
napi = { version = "3", features = ["napi9", "compat-mode"] }
napi-derive = "3"
rusqlite = { version = "0.33", features = [
  "bundled",
  "backup",
  "blob",
  "hooks",
  "trace",
  "column_decltype",
] }
libsqlite3-sys = { version = "0.31", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
rayon = "1.10"
zero-ivm-rs = { path = "../zero-ivm-rs" }
base64 = "0.22"

[dev-dependencies]
tempfile = "3"

[build-dependencies]
napi-build = "2"

[profile.release]
lto = true
strip = "symbols"
