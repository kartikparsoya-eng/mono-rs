[package]
name = "zqlite-rs"
version = "0.0.0"
edition = "2021"

[lib]
crate-type = ["cdylib"]

[dependencies]
napi = { version = "3", features = ["napi9", "compat-mode"] }
napi-derive = "3"
rusqlite = { version = "0.33", features = ["bundled", "backup", "blob", "hooks", "trace"] }

[build-dependencies]
napi-build = "2"

[profile.release]
lto = true
strip = "symbols"
